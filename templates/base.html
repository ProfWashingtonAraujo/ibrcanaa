{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{% block title %}IBR Canaã{% endblock %}</title>
  <meta name="description" content="Sistema de gestão e comunidade da Igreja Batista Regular Canaã.">
  <meta name="theme-color" content="#07142f">
  <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=20260813-17">
  {% block extra_head %}{% endblock %}
  <script src="https://cdn.plot.ly/plotly-3.4.0.min.js" charset="utf-8"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if messages %}
    <div class="toast-stack">
      {% for message in messages %}<div class="toast">{{ message }}</div>{% endfor %}
    </div>
  {% endif %}
  {% block content %}{% endblock %}
  {% block extra_scripts %}{% endblock %}
</body>
</html>
