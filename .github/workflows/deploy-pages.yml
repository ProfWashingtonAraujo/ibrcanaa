name: Validate and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate project
        run: python manage.py check

      - name: Validate production settings
        env:
          DJANGO_DEBUG: "False"
          # Valor descartável apenas para o CI; não é um segredo real.
          DJANGO_SECRET_KEY: ci-only-Zq7vN3xR9mK2pL8wT5yB1cD6fG4hJ0sA-unique-not-a-real-secret
          DATABASE_URL: sqlite:///ci-check.db
        run: python manage.py check --deploy --fail-level WARNING

      - name: Run tests
        run: python manage.py test

      - name: Prepare static site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/assets
          cp pages/index.html _site/index.html
          cp pages/assets/app.css _site/assets/app.css
          cp pages/assets/daily-verse.css _site/assets/daily-verse.css
          cp pages/assets/favicon.svg _site/assets/favicon.svg
          cp src/assets/logo.png _site/assets/logo.png
          cp src/assets/frente_igreja.png _site/assets/frente_igreja.png
          touch _site/.nojekyll

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
